<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p class="site-footer__name">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
    <ul class="site-footer__links">
      {% if site.instagram %}<li><a href="https://instagram.com/{{ site.instagram }}" rel="me">Instagram</a></li>{% endif %}
      {% if site.email and site.email != "" %}<li><a href="mailto:{{ site.email }}">Email</a></li>{% endif %}
      <li><a href="{{ '/journal/feed.xml' | relative_url }}">Journal feed</a></li>
    </ul>
  </div>
</footer>
